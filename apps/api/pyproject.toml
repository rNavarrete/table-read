[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# SQLAlchemy warnings (e.g. identity-map conflicts in the snapshot write-path)
# are bugs, not noise — fail the suite on them (controller ruling, T1.1).
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

# Table Read model pinning (docs/tableread-prompt-spec.md §8: prompts
# reference model *roles* -- `writer`, `classifier`, `import_worker`,
# `import_analyst` --
# "resolved via config/models.toml, which pins exact model IDs"). Every LLM
# call logs both the role and the resolved model id; changing a pinned id
# here is a versioned change requiring `make evals` sign-off, same as a
# prompt-template edit (CLAUDE.md hard rule 7). Reassigning an op's role in
# llm/ops.py is likewise a versioned model-path change (evals before merge).
#
# Role split (product intent):
#   classifier (Haiku 5.5) = grounded extraction / deterministic reads
#     (ledger facts, blast radius, suggestions, consistency scan) at low
#     effort.
#   import_worker (Sonnet 5.5) = bounded, repeatable import work
#     (per-scene segmentation and chunked entity extraction). This keeps
#     routine high-volume calls fast and cost-efficient.
#   import_analyst (Opus 5.5) = story-wide import judgment
#     (act inference, narrative promises, story overview).
#   writer (Sonnet 5.5) = synthesis / judgment
#     (beat candidates, tune, regenerate, scene skeleton).
#
# The 5.5 family constrains every request (anthropic_client):
#   - No sampling parameters. All three reject a non-default `temperature`,
#     including Haiku 5.5, so the classifier no longer runs at temperature 0
#     (owner decision 2026-10-11; prompt spec §8). Its consistency comes from
#     the strict tool schema and low effort.
#   - No forced tool choice. Opus 5.5 and Sonnet 5.5 reject `tool_choice`
#     `tool`/`any`, so every op offers its one strict tool with `auto` and the
#     prompt asks for the call; a prose reply without it gets one retry, a
#     refusal none (llm/anthropic_client.py).
#   - No disabled thinking on Opus 5.5 or Sonnet 5.5; effort is the lever.
#     Opus 5.5 at its `medium` default already exceeds Opus 5 at `high`; the
#     import_analyst ops set `medium` explicitly (llm/ops.py). Thinking counts
#     toward max_tokens, so ceilings leave room for it.

[models]
writer = "claude-sonnet-5-5"
classifier = "claude-haiku-5-5"
import_worker = "claude-sonnet-5-5"
import_analyst = "claude-opus-5-5"

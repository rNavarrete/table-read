# Table Read model pinning (docs/tableread-prompt-spec.md §8: prompts
# reference model *roles* -- `writer`, `classifier`, `import_worker`,
# `import_analyst` --
# "resolved via config/models.toml, which pins exact model IDs"). Every LLM
# call logs both the role and the resolved model id; changing a pinned id
# here is a versioned change requiring `make evals` sign-off, same as a
# prompt-template edit (CLAUDE.md hard rule 7). Reassigning an op's role in
# llm/ops.py is likewise a versioned model-path change (evals before merge).
#
# Role split (product intent):
#   classifier (Haiku) = grounded extraction / deterministic reads
#     (ledger facts, blast radius, suggestions, consistency scan) —
#     anthropic_client sends temperature=0
#   import_worker (Sonnet 5) = bounded, repeatable import work
#     (per-scene segmentation and chunked entity extraction). This keeps
#     routine high-volume calls fast and cost-efficient.
#   import_analyst (Opus 5) = story-wide import judgment
#     (act inference, narrative promises, story overview). Opus rejects
#     non-default temperature; omit it.
#   writer (Sonnet) = synthesis / judgment
#     (beat candidates, tune, regenerate, scene skeleton). Writer tier
#     must omit temperature (see below).
#
# Model-id gap (flagged per the T1.2 task brief): the prompt spec gives its
# pinned id as an illustrative example ("e.g., writer =
# claude-sonnet-4-5-20250929") rather than a firm assignment, and that
# example id is itself a retired snapshot. The ids below are best-effort
# defaults -- confirm the tier/cost tradeoff with the controller before
# `make evals` or production use.
#
# `classifier` intentionally targets a model tier that still accepts an
# explicit non-default `temperature`: the prompt spec requires
# "Temperature 0" on every classifier op (§3/§5/§6/§8c), but current-
# generation Sonnet 5 / Opus 5 reject any non-default `temperature`
# outright (400 invalid_request_error). Haiku 4.5 still accepts it, so this
# is a functional requirement here, not just a cost choice. Writer-role and
# import_worker/import_analyst ops therefore never send `temperature`
# (anthropic_client).

[models]
writer = "claude-sonnet-5"
classifier = "claude-haiku-4-5"
import_worker = "claude-sonnet-5"
import_analyst = "claude-opus-5"
